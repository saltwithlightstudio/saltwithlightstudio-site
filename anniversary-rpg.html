<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>鹽與光十週年｜RPG 練團室</title>
  <style>
    :root {
      --wine: #681015;
      --wine-dark: #2a080a;
      --ink: #160506;
      --gold: #d8ad5b;
      --gold-soft: #f0d49a;
      --ivory: #f6e8c8;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ivory);
      background:
        radial-gradient(circle at 50% -20%, #6e1b1e 0, transparent 45%),
        linear-gradient(160deg, #090202, var(--ink) 60%, #260709);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Noto Sans TC", monospace;
    }

    button, a { font: inherit; }

    .page {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: clamp(14px, 2.5vw, 34px);
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 42px);
      letter-spacing: .08em;
      text-shadow: 3px 3px 0 #270506;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #decda7;
      font-size: 12px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #8bd46e;
      box-shadow: 0 0 0 2px #173111, 0 0 12px #8bd46e;
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .game-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .game-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 12px;
      border: 2px solid #8e622e;
      color: var(--ivory);
      background: #2c0b0e;
      box-shadow: 3px 3px 0 #090204;
      text-decoration: none;
      cursor: pointer;
    }

    .game-control:hover,
    .game-control:focus-visible {
      color: #23120a;
      background: var(--gold-soft);
      border-color: var(--gold-soft);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .game-control[aria-pressed="true"] {
      color: #23120a;
      background: var(--gold-soft);
      border-color: #fff1c3;
      box-shadow: 3px 3px 0 #6f431d, 0 0 16px #d8ad5b66;
    }

    .music-toggle {
      min-height: 44px;
      padding: 8px 12px;
      border: 2px solid var(--gold);
      color: var(--ivory);
      background: #43111a;
      box-shadow: 3px 3px 0 #090204;
      cursor: pointer;
    }

    .music-toggle:hover,
    .music-toggle:focus-visible,
    .music-toggle[aria-pressed="true"] {
      color: #23120a;
      background: var(--gold-soft);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .music-toggle[aria-pressed="true"] {
      box-shadow: 3px 3px 0 #6f431d, 0 0 14px #d8ad5b66;
    }

    .game-shell {
      position: relative;
      overflow: hidden;
      border: 3px solid #9b6a2d;
      background: #080202;
      box-shadow:
        0 0 0 5px #260807,
        0 0 0 7px #4f1d14,
        0 24px 70px #000b;
    }

    .game-shell::before {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: 5;
      border: 1px solid #f0d49a55;
      pointer-events: none;
    }

    .canvas-wrap {
      position: relative;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      background: #190806;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: pointer;
      touch-action: manipulation;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      background: #120405;
      color: var(--gold-soft);
      font-size: 13px;
      letter-spacing: .12em;
      transition: opacity .35s ease;
    }

    .loading.is-ready { opacity: 0; pointer-events: none; }

    .loading::after {
      content: "";
      width: 12px;
      height: 12px;
      margin-left: 12px;
      background: var(--gold);
      display: inline-block;
      animation: blink .7s steps(2) infinite;
    }

    @keyframes blink { 50% { opacity: .2; } }

    .dialogue {
      position: absolute;
      z-index: 6;
      left: clamp(10px, 3vw, 44px);
      right: clamp(10px, 3vw, 44px);
      bottom: clamp(10px, 2.2vw, 30px);
      display: grid;
      grid-template-columns: clamp(88px, 12vw, 150px) 1fr auto;
      gap: clamp(10px, 2vw, 22px);
      align-items: center;
      min-height: clamp(138px, 18vw, 198px);
      padding: clamp(11px, 2vw, 20px);
      border: 4px solid var(--ivory);
      background: linear-gradient(180deg, #21144bf2, #11092df7);
      box-shadow:
        inset 0 0 0 4px #6e53c5,
        8px 8px 0 #05020cbb;
    }

    .dialogue[hidden] { display: none; }

    .dialogue.is-sleep-deprived {
      grid-template-columns: clamp(150px, 13vw, 190px) 1fr clamp(96px, 9vw, 118px);
      min-height: clamp(230px, 20vw, 320px);
      gap: clamp(18px, 2.2vw, 34px);
      padding: clamp(38px, 3vw, 48px) clamp(32px, 3.5vw, 52px);
      border: 0;
      background: url("assets/anniversary-rpg/sleep-deprived-dialogue-frame-web-v1.png") center / 100% 100% no-repeat;
      box-shadow: none;
    }

    .dialogue.is-sleep-deprived .dialogue__portrait {
      justify-self: start;
      width: auto;
      height: clamp(155px, 14vw, 220px);
      max-width: 100%;
      aspect-ratio: 4 / 5;
      border: 0;
      background: #020202;
    }

    .dialogue.is-sleep-deprived .dialogue__portrait img.is-full-frame {
      object-fit: cover;
      object-position: 50% 28%;
      image-rendering: pixelated;
      filter: contrast(1.08);
    }

    .dialogue.is-sleep-deprived .dialogue__name {
      color: #fff;
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: clamp(15px, 1.8vw, 22px);
      letter-spacing: .12em;
      text-shadow: 2px 2px 0 #5f0c11;
    }

    .dialogue.is-sleep-deprived .dialogue__role { color: #bd3138; }

    .dialogue.is-sleep-deprived .dialogue__text {
      color: #f7f4ee;
      font-family: "Noto Serif TC", "Songti TC", serif;
      line-height: 1.8;
      text-shadow: 1px 1px 0 #000;
    }

    .dialogue.is-sleep-deprived .dialogue__actions {
      justify-self: end;
      width: 100%;
      gap: 13px;
    }

    .dialogue.is-sleep-deprived .pixel-button {
      min-width: 0;
      min-height: 52px;
      border: 2px solid #f4f1e9;
      color: #fff;
      background: #070707;
      box-shadow: 3px 3px 0 #6e0f15;
    }

    .dialogue.is-sleep-deprived .pixel-button:hover,
    .dialogue.is-sleep-deprived .pixel-button:focus-visible {
      color: #fff;
      background: #74151b;
    }

    .dialogue__portrait {
      display: grid;
      place-items: end center;
      align-self: center;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 2px solid var(--gold);
      background: radial-gradient(circle at 50% 30%, #754946, #241020 72%);
    }

    .dialogue__portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      image-rendering: pixelated;
    }

    .dialogue__portrait img.is-full-frame {
      object-fit: contain;
      object-position: 50% 0;
      image-rendering: auto;
    }

    .dialogue__name {
      margin: 0 0 6px;
      color: var(--gold-soft);
      font-size: clamp(12px, 1.6vw, 18px);
      letter-spacing: .08em;
    }

    .dialogue__role {
      color: #bca9f0;
      font-size: .72em;
      letter-spacing: .04em;
    }

    .dialogue__text {
      min-height: 2.8em;
      margin: 0;
      color: #fff8e8;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      font-size: clamp(13px, 1.8vw, 20px);
      line-height: 1.65;
    }

    .dialogue__actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pixel-button {
      min-width: 62px;
      padding: 8px 10px;
      border: 2px solid var(--gold);
      color: var(--ivory);
      background: #43111a;
      box-shadow: 3px 3px 0 #090204;
      cursor: pointer;
    }

    .pixel-button:hover,
    .pixel-button:focus-visible {
      color: #23120a;
      background: var(--gold-soft);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 2px 0;
      color: #cdbc9a;
      font-size: 12px;
      line-height: 1.6;
    }

    .hud strong { color: var(--gold-soft); }

    .teacher-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .teacher-nav button {
      padding: 6px 9px;
      border: 1px solid #8e622e;
      color: #e9ddc4;
      background: #2c0b0e;
      cursor: pointer;
    }

    .teacher-nav button:hover,
    .teacher-nav button:focus-visible {
      border-color: var(--gold-soft);
      color: #160506;
      background: var(--gold-soft);
      outline: none;
    }

    .note {
      margin: 14px 0 0;
      color: #a99175;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .page { padding: 12px 8px 24px; }
      .page-header { align-items: flex-start; flex-direction: column; gap: 8px; }
      .header-meta { width: 100%; justify-content: space-between; }
      .game-controls { width: 100%; }
      .game-control { flex: 1 1 auto; }
      .eyebrow { max-width: 100%; font-size: 9px; line-height: 1.6; overflow-wrap: anywhere; }
      .canvas-wrap { aspect-ratio: 1672 / 941; }
      canvas { width: 100%; height: 100%; position: static; transform: none; }
      .dialogue { grid-template-columns: 68px 1fr; border-width: 3px; }
      .dialogue__actions { grid-column: 1 / -1; flex-direction: row; justify-content: flex-end; }
      .dialogue__portrait { min-height: 0; }
      .dialogue__text { font-size: 13px; }
      .dialogue.is-sleep-deprived {
        grid-template-columns: 76px 1fr;
        min-height: 205px;
        gap: 12px;
        padding: 29px 25px 25px;
      }
      .dialogue.is-sleep-deprived .dialogue__portrait { height: 96px; }
      .dialogue.is-sleep-deprived .dialogue__actions {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: flex-end;
        width: auto;
      }
      .dialogue.is-sleep-deprived .pixel-button { min-width: 76px; min-height: 38px; }
      .hud { align-items: flex-start; flex-direction: column; }
      .teacher-nav { justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Salt &amp; Light · RPG Scene Prototype</p>
        <h1 id="roomTitle">十週年練團室</h1>
      </div>
      <div class="header-meta">
        <p class="status" id="gameStatus">老師們正在練團室準備中</p>
        <nav class="game-controls" aria-label="遊戲頁面控制">
          <button class="game-control" id="teacherRoomButton" type="button" aria-pressed="true">老師練團室</button>
          <button class="game-control" id="participantRoomButton" type="button" aria-pressed="false">參加者休息室</button>
          <a class="game-control" href="index.html#anniversary">← 回到十週年介面</a>
        </nav>
        <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="播放背景音樂">
          ♫ <span id="musicToggleText">音樂：關</span>
        </button>
        <button class="music-toggle" id="sfxToggle" type="button" aria-pressed="false" aria-label="開啟角色音效">
          🔊 <span id="sfxToggleText">音效：關</span>
        </button>
      </div>
    </header>

    <audio id="bgMusic" preload="metadata" loop>
      <source src="assets/anniversary-rpg/warm-family-theme.ogg" type="audio/ogg">
      <source src="assets/anniversary-rpg/warm-family-theme.mp3" type="audio/mpeg">
    </audio>

    <section class="game-shell" id="gameShell" aria-label="鹽與光十週年 RPG 練團室互動場景">
      <div class="canvas-wrap">
        <canvas id="game" width="1672" height="941" aria-label="七位老師在練團室中走動；點擊角色可以互動"></canvas>
        <div class="loading" id="loading">LOADING RPG ROOM</div>

        <section class="dialogue" id="dialogue" hidden aria-live="polite" aria-label="角色對話">
          <div class="dialogue__portrait"><img id="dialoguePortrait" alt=""></div>
          <div>
            <h2 class="dialogue__name"><span id="dialogueName"></span> <span class="dialogue__role" id="dialogueRole"></span></h2>
            <p class="dialogue__text" id="dialogueText"></p>
          </div>
          <div class="dialogue__actions">
            <button class="pixel-button" id="dialogueNext" type="button">下一句</button>
            <button class="pixel-button" id="dialogueClose" type="button">離開</button>
          </div>
        </section>
      </div>
    </section>

    <div class="hud">
      <span id="roomInstructions"><strong>操作：</strong>點擊老師開始對話；部分老師的特殊動作會隨機逐一觸發，其他老師將依自己的個性輪流回應。</span>
      <nav class="teacher-nav" id="teacherNav" aria-label="選擇老師互動"></nav>
    </div>
    <p class="note">十週年音樂會場地已確認；完整活動資訊與節目安排，請以鹽與光後續正式公告為準。</p>
  </main>

  <script>
    (() => {
      "use strict";

      const WIDTH = 1672;
      const HEIGHT = 941;
      const ASSET_ROOT = "assets/anniversary-rpg";
      const ASSET_VERSION = "20260818-guliu-head-repair-v5";
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d", { alpha: false });
      const loading = document.querySelector("#loading");
      const roomTitle = document.querySelector("#roomTitle");
      const gameShell = document.querySelector("#gameShell");
      const gameStatus = document.querySelector("#gameStatus");
      const roomInstructions = document.querySelector("#roomInstructions");
      const teacherNav = document.querySelector("#teacherNav");
      const teacherRoomButton = document.querySelector("#teacherRoomButton");
      const participantRoomButton = document.querySelector("#participantRoomButton");
      const dialogue = document.querySelector("#dialogue");
      const dialoguePortrait = document.querySelector("#dialoguePortrait");
      const dialogueName = document.querySelector("#dialogueName");
      const dialogueRole = document.querySelector("#dialogueRole");
      const dialogueText = document.querySelector("#dialogueText");
      const dialogueNext = document.querySelector("#dialogueNext");
      const dialogueClose = document.querySelector("#dialogueClose");
      const bgMusic = document.querySelector("#bgMusic");
      const musicToggle = document.querySelector("#musicToggle");
      const musicToggleText = document.querySelector("#musicToggleText");
      const sfxToggle = document.querySelector("#sfxToggle");
      const sfxToggleText = document.querySelector("#sfxToggleText");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const directions = ["down", "up", "left", "right"];
      const ROOM_TEACHERS = "teachers";
      const ROOM_PARTICIPANTS = "participants";

      context.imageSmoothingEnabled = false;

      const teacherSpecs = [
        {
          id: "ting", name: "Ting", role: "Bass 老師", x: 350, y: 620, height: 174,
          lines: [
            "嗨，我是 Ting，負責 Bass。通常站得不顯眼，但少了我，大家馬上就會發現。",
            "Bass 是樂團的靈魂，不是邊緣人……至少我是這樣安慰自己的。",
            "最近大家老是在練同一批歌，還把日期拆成節奏密碼藏進譜裡。很可疑吧？",
            "我的譜上有四個小節，每小節剛好四拍。把所有拍子數完，也許就是日期裡缺的那個數字。",
            "場地已經確定了，但我只給第一段密碼：它靠近港邊，名字的開頭像一串彎彎的黃色月亮。",
            "先猜出那個兩個字的水果，再去找其他老師拿後面的三個字。"
          ],
          bubbles: ["低音走起！", "再穩一點", "♪"]
        },
        {
          id: "mina", name: "Mina", role: "老闆娘・歌唱老師", x: 650, y: 460, height: 169,
          lines: [
            "我是 Mina，鹽與光的老闆娘，也是歌唱老師。先吸一口氣，再把今天的聲音唱出來吧。",
            "如果你看到五隻虎斑貓、一隻黑貓和一隻猩猩玩偶，那不是幻覺，只是我的日常。",
            "熟悉的教室、熟悉的人，一首一首唱著唱著，竟然就走到第十年了。",
            "所以最近偷偷在準備一場十週年音樂會，想把以前的回憶和現在的聲音放在同一個舞台。",
            "我講個開心的故事：跨年煙火結束後，一個孩子收到全新的月曆。他翻開完全空白的第一頁，寫下今年第一首歌。那一頁的月份，就是我們要找的答案。",
            "以前曾在鹽與光上過課的同學，也可以報名爭取演出機會喔。",
            "報名不用找神祕 NPC，直接聯絡以前在鹽與光上課的老師就可以了。",
            "期限？我只記得行事曆圈在八月第一個禮拜天……先去問老師，動作要快喔。"
          ],
          bubbles: ["吸氣～", "一起唱！", "好聽耶"]
        },
        {
          id: "wanting", name: "宛庭", role: "歌唱・爵士鼓老師", x: 930, y: 650, height: 167,
          lines: [
            "我是宛庭，教歌唱也教爵士鼓。唱歌要呼吸，打鼓也要呼吸，我們先一起數四拍。",
            "偶爾我也會坐下來敲手碟，讓腦袋安靜一點。海龜如果出現，就表示今天很和平。",
            "最近大家問我，十週年那天是不是要空出一整天。其實不用，應該是下午的活動。",
            "我把日期練成一段節奏：四拍走完要重複四次。別只跟著打拍子，總拍數才是線索。",
            "我好像看到流程紙上寫著 14:00 到 17:00……但節目順序還在排，先當作內部線索喔。",
            "當天不只老師會演出，也正在找曾經在鹽與光上課的同學一起回到舞台。",
            "好了，線索說完。現在閉上眼睛，聽手碟的聲音……欸，海龜真的來了！"
          ],
          bubbles: ["1、2、3、4！", "節奏進來", "啪、答！"]
        },
        {
          id: "tc", name: "TC", role: "老闆・吉他老師", x: 560, y: 745, height: 202,
          lines: [
            "我是 TC，鹽與光的老闆兼吉他老師。再一遍，這次把手放鬆，讓節奏自己往前。",
            "不上課的時候？大概就是刻線、打磨、噴漆，努力把 SD 鋼彈做得比本人還精緻。",
            "最近手上的大工程不是模型，是把十年的老師、學生和音樂重新組成一場演出。",
            "日期零件被我排成四乘四的方陣，全部裝完才會顯示正確數字。這個零件可不能裝錯。",
            "場地已經正式蓋章，就在高雄駁二附近。第二段密碼，是由旋律和節奏組成、讓耳朵聽見的兩個字。",
            "把水果答案接上那兩個字，還差最後一字。去問肩膀上有小麻雀的老師。"
          ],
          bubbles: ["再一遍！", "Groove！", "刷下去"]
        },
        {
          id: "cindy", name: "Cindy", role: "歌唱・鋼琴老師", x: 1060, y: 455, height: 163,
          lines: [
            "我是 Cindy，教歌唱也教鋼琴。先聽和弦，再讓聲音慢慢走進去。",

      function renderMusicState(enabled) {
        musicToggle.setAttribute("aria-pressed", String(enabled));
        musicToggle.setAttribute("aria-label", enabled ? "暫停背景音樂" : "播放背景音樂");
        musicToggleText.textContent = enabled ? "音樂：開" : "音樂：關";
      }

      function fadeMusic(targetVolume, duration = 320, onComplete = null) {
        const token = ++musicFadeToken;
        const startVolume = bgMusic.volume;
        const startedAt = performance.now();

        const step = now => {
          if (token !== musicFadeToken) return;
          const progress = Math.min(1, (now - startedAt) / duration);
          const eased = progress * (2 - progress);
          bgMusic.volume = startVolume + (targetVolume - startVolume) * eased;
          if (progress < 1) requestAnimationFrame(step);
          else if (onComplete) onComplete();
        };

        requestAnimationFrame(step);
      }

      async function startMusic() {
        ++musicFadeToken;
        bgMusic.volume = 0;
        try {
          await bgMusic.play();
          musicWanted = true;
          renderMusicState(true);
          fadeMusic(MUSIC_VOLUME);
        } catch (error) {
          musicWanted = false;
          renderMusicState(false);
          console.warn("背景音樂無法播放", error);
        }
      }

      function stopMusic() {
        musicWanted = false;
        renderMusicState(false);
        fadeMusic(0, 240, () => bgMusic.pause());

      function renderSfxState(enabled) {

        sfxToggleText.textContent = enabled ? "音效：開" : "音效：關";
      }

      function getAudioContext() {
        if (audioContext) return audioContext;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        audioContext = new AudioContextClass();
        return audioContext;
      }

      function trackSpecialSource(session, source) {
        if (session) session.sources.push(source);
        return source;
      }

      function createNoiseBuffer(audio, duration, smoothing = 0) {
        const frameCount = Math.max(1, Math.floor(audio.sampleRate * duration));
        const buffer = audio.createBuffer(1, frameCount, audio.sampleRate);
        const data = buffer.getChannelData(0);
        let last = 0;
        for (let index = 0; index < frameCount; index += 1) {
          const white = Math.random() * 2 - 1;
          last = last * smoothing + white * (1 - smoothing);
          const scale = smoothing > .8 ? 4 : 1;
          data[index] = Math.max(-1, Math.min(1, last * scale));
        }
        return buffer;
      }

      function stopSpecialActionSound(id = null, immediate = false) {
        const session = activeSpecialSound;
        if (!session || (id && session.id !== id)) return;
        activeSpecialSound = null;
        delete gameShell.dataset.specialSound;
        delete gameShell.dataset.specialSoundContainsBass;
        session.timers.forEach(timer => window.clearTimeout(timer));

        const now = session.audio.currentTime;
        if (!immediate) {
          try {
            session.master.gain.cancelScheduledValues(now);
            session.master.gain.setValueAtTime(Math.max(.0001, session.master.gain.value), now);
            session.master.gain.exponentialRampToValueAtTime(.0001, now + .08);
          } catch {}
        }
        session.sources.forEach(source => {
          try { source.stop(immediate ? now : now + .09); } catch {}
        });
        const disconnect = () => {
          try { session.master.disconnect(); } catch {}
          try { session.limiter.disconnect(); } catch {}
        };
        if (immediate) disconnect();
        else window.setTimeout(disconnect, 140);
      }

      function beginSpecialActionSound(id, volume = .78) {
        stopSpecialActionSound();
        if (!sfxEnabled || currentRoom !== ROOM_TEACHERS || activeSpecialActionId !== id) return null;
        const audio = getAudioContext();
        if (!audio || audio.state !== "running") return null;
        const master = audio.createGain();
        const limiter = audio.createDynamicsCompressor();
        master.gain.setValueAtTime(volume, audio.currentTime);
        limiter.threshold.setValueAtTime(-8, audio.currentTime);
        limiter.knee.setValueAtTime(6, audio.currentTime);
        limiter.ratio.setValueAtTime(12, audio.currentTime);
        limiter.attack.setValueAtTime(.003, audio.currentTime);
        limiter.release.setValueAtTime(.14, audio.currentTime);
        master.connect(limiter);
        limiter.connect(audio.destination);
        const session = { id, audio, master, limiter, sources: [], timers: [], containsBass: id === "ting" };
        activeSpecialSound = session;
        gameShell.dataset.specialSound = id;
        gameShell.dataset.specialSoundContainsBass = String(session.containsBass);
        console.assert(!session.containsBass || id === "ting", "Bass 音效只能由 Ting 觸發");
        return session;
      }

      function scheduleTone(session, {
        at = 0,
        frequency,
        endFrequency = frequency,
        duration = .3,
        type = "sine",
        volume = .06,
        attack = .01,
        release = .12,
        destination = session.master
      }) {
        const audio = session.audio;
        const startsAt = audio.currentTime + at;
        const endsAt = startsAt + duration;
        const releaseAt = Math.max(startsAt + attack + .001, endsAt - release);
        const oscillator = trackSpecialSource(session, audio.createOscillator());
        const gain = audio.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(Math.max(1, frequency), startsAt);
        if (endFrequency !== frequency) {
          oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), endsAt);
        }
        gain.gain.setValueAtTime(.0001, startsAt);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002, volume), startsAt + attack);
        gain.gain.setValueAtTime(Math.max(.0002, volume * .72), releaseAt);
        gain.gain.exponentialRampToValueAtTime(.0001, endsAt);
        oscillator.connect(gain);
        gain.connect(destination);
        oscillator.start(startsAt);
        oscillator.stop(endsAt + .03);
        return oscillator;
      }

      function scheduleNoise(session, {
        at = 0,
        duration = .3,
        volume = .04,
        smoothing = 0,
        filterType = "bandpass",
        filterFrequency = 1200,
        q = .8,
        attack = .015,
        release = .08,
        destination = session.master
      }) {
        const audio = session.audio;
        const startsAt = audio.currentTime + at;
        const endsAt = startsAt + duration;
        const releaseAt = Math.max(startsAt + attack + .001, endsAt - release);
        const source = trackSpecialSource(session, audio.createBufferSource());
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();
        source.buffer = createNoiseBuffer(audio, duration + .05, smoothing);
        filter.type = filterType;
        filter.frequency.setValueAtTime(filterFrequency, startsAt);
        filter.Q.setValueAtTime(q, startsAt);
        gain.gain.setValueAtTime(.0001, startsAt);
        gain.gain.exponentialRampToValueAtTime(Math.max(.0002, volume), startsAt + attack);
        gain.gain.setValueAtTime(Math.max(.0002, volume * .7), releaseAt);
        gain.gain.exponentialRampToValueAtTime(.0001, endsAt);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(destination);
        source.start(startsAt);
        source.stop(endsAt + .03);
        return source;
      }

      function playWantingForestSounds(session) {

        const windGain = audio.createGain();

        wind.loop = true;
        highpass.type = "highpass";
        highpass.frequency.setValueAtTime(260, startsAt);
        lowpass.type = "lowpass";
        lowpass.frequency.setValueAtTime(2600, startsAt);
        windGain.gain.setValueAtTime(.0001, startsAt);

        windGain.gain.exponentialRampToValueAtTime(.0001, startsAt + 9.15);

      function playTingBassSolo(session) {
        if (session.id !== "ting" || activeSpecialActionId !== "ting") return;

          scheduleNoise(session, {

      function playCindyDogBarks(session) {
        const audio = session.audio;
        const startsAt = audio.currentTime;
        const barkHighpass = audio.createBiquadFilter();
        const barkLowpass = audio.createBiquadFilter();

        barkHighpass.type = "highpass";
        barkHighpass.frequency.setValueAtTime(280, startsAt);
        barkHighpass.Q.setValueAtTime(.55, startsAt);
        barkLowpass.type = "lowpass";
        barkLowpass.frequency.setValueAtTime(3500, startsAt);
        barkLowpass.Q.setValueAtTime(.55, startsAt);
        barkHighpass.connect(barkLowpass);
        barkLowpass.connect(session.master);

        function scheduleNaturalBark({ at, duration, base, level, f1, f2 }) {
          const beginsAt = audio.currentTime + at;
          const endsAt = beginsAt + duration;
          const noise = trackSpecialSource(session, audio.createBufferSource());
          const firstFormant = audio.createBiquadFilter();
          const secondFormant = audio.createBiquadFilter();
          const firstFormantGain = audio.createGain();
          const secondFormantGain = audio.createGain();
          const barkEnvelope = audio.createGain();
          const voice = trackSpecialSource(session, audio.createOscillator());
          const voiceLowpass = audio.createBiquadFilter();
          const voiceEnvelope = audio.createGain();
          const voiceEndsAt = Math.min(endsAt, beginsAt + .095);

          noise.buffer = createNoiseBuffer(audio, duration + .03, .22);
          firstFormant.type = "bandpass";
          firstFormant.frequency.setValueAtTime(f1, beginsAt);
          firstFormant.frequency.exponentialRampToValueAtTime(f1 * .8, endsAt);
          firstFormant.Q.setValueAtTime(1.3, beginsAt);
          firstFormantGain.gain.setValueAtTime(.085 * level, beginsAt);
          secondFormant.type = "bandpass";
          secondFormant.frequency.setValueAtTime(f2, beginsAt);
          secondFormant.frequency.exponentialRampToValueAtTime(f2 * .88, endsAt);
          secondFormant.Q.setValueAtTime(1.7, beginsAt);
          secondFormantGain.gain.setValueAtTime(.035 * level, beginsAt);

          barkEnvelope.gain.setValueAtTime(.0001, beginsAt);
          barkEnvelope.gain.linearRampToValueAtTime(1, beginsAt + .003);
          barkEnvelope.gain.exponentialRampToValueAtTime(.55, beginsAt + .018);
          barkEnvelope.gain.linearRampToValueAtTime(.8, beginsAt + .032);
          barkEnvelope.gain.exponentialRampToValueAtTime(.14, beginsAt + duration * .62);
          barkEnvelope.gain.exponentialRampToValueAtTime(.0001, endsAt);

          noise.connect(firstFormant);
          noise.connect(secondFormant);
          firstFormant.connect(firstFormantGain);
          secondFormant.connect(secondFormantGain);
          firstFormantGain.connect(barkEnvelope);
          secondFormantGain.connect(barkEnvelope);
          barkEnvelope.connect(barkHighpass);

          voice.type = "triangle";
          voice.frequency.setValueAtTime(base, beginsAt);
          voice.frequency.exponentialRampToValueAtTime(base * 1.1, beginsAt + .01);
          voice.frequency.exponentialRampToValueAtTime(base * .74, voiceEndsAt);
          voiceLowpass.type = "lowpass";
          voiceLowpass.frequency.setValueAtTime(1300, beginsAt);
          voiceLowpass.Q.setValueAtTime(.65, beginsAt);
          voiceEnvelope.gain.setValueAtTime(.0001, beginsAt);
          voiceEnvelope.gain.exponentialRampToValueAtTime(.021 * level, beginsAt + .006);
          voiceEnvelope.gain.exponentialRampToValueAtTime(.006 * level, beginsAt + .045);
          voiceEnvelope.gain.exponentialRampToValueAtTime(.0001, voiceEndsAt);
          voice.connect(voiceLowpass);
          voiceLowpass.connect(voiceEnvelope);
          voiceEnvelope.connect(barkHighpass);

          noise.start(beginsAt);
          voice.start(beginsAt);
          noise.stop(endsAt + .02);
          voice.stop(voiceEndsAt + .02);
        }

        [
          { at: .42, duration: .15, base: 470, level: .92, f1: 920, f2: 2050 },
          { at: .7, duration: .105, base: 545, level: .66, f1: 1030, f2: 2320 },
          { at: 3.62, duration: .155, base: 445, level: 1, f1: 870, f2: 1920 },
          { at: 3.91, duration: .125, base: 510, level: .76, f1: 970, f2: 2180 },
          { at: 4.29, duration: .095, base: 575, level: .54, f1: 1080, f2: 2450 }
        ].forEach(scheduleNaturalBark);
      }

      function playLilingSparrowChirps(session) {
        const birdHighpass = session.audio.createBiquadFilter();

            scheduleNoise(session, {

              volume: .008,
              filterType: "highpass",

      function playCatMeow(pitchShift = 0, volume = .16, session = null) {
        if (!sfxEnabled) return;
        const audio = getAudioContext();
        if (!audio || audio.state !== "running") return;
        const now = audio.currentTime;
        const duration = .62 + Math.random() * .2;
        const base = 610 + pitchShift + Math.random() * 90;
        const output = audio.createGain();
        const formant = audio.createBiquadFilter();
        const voice = audio.createOscillator();
        const overtone = audio.createOscillator();
        const overtoneGain = audio.createGain();

        output.gain.setValueAtTime(.0001, now);
        output.gain.exponentialRampToValueAtTime(volume, now + .055);
        output.gain.setValueAtTime(volume, now + duration * .48);
        output.gain.exponentialRampToValueAtTime(.0001, now + duration);

        formant.type = "bandpass";
        formant.Q.setValueAtTime(2.4, now);
        formant.frequency.setValueAtTime(1180 + pitchShift, now);
        formant.frequency.exponentialRampToValueAtTime(820 + Math.max(0, pitchShift), now + duration);

        voice.type = "triangle";
        voice.frequency.setValueAtTime(base, now);
        voice.frequency.exponentialRampToValueAtTime(base * 1.42, now + duration * .2);
        voice.frequency.exponentialRampToValueAtTime(base * .72, now + duration);

        overtone.type = "sine";
        overtone.frequency.setValueAtTime(base * 2.02, now);
        overtone.frequency.exponentialRampToValueAtTime(base * 2.78, now + duration * .2);
        overtone.frequency.exponentialRampToValueAtTime(base * 1.38, now + duration);
        overtoneGain.gain.setValueAtTime(.14, now);

        voice.connect(formant);
        overtone.connect(overtoneGain);
        overtoneGain.connect(formant);
        formant.connect(output);
        output.connect(session?.master || audio.destination);
        trackSpecialSource(session, voice);
        trackSpecialSource(session, overtone);
        voice.start(now);
        overtone.start(now);
        voice.stop(now + duration + .04);
        overtone.stop(now + duration + .04);
        lastCatSoundAt = performance.now();
      }

      function playMinaCatSounds(session) {
        if (!sfxEnabled || currentRoom !== ROOM_TEACHERS) return;
        if (!session && performance.now() - lastCatSoundAt < 700) return;
        playCatMeow(Math.random() * 90 - 30, .16, session);

            currentRoom === ROOM_TEACHERS &&
            activeSpecialActionId === "mina" &&

        if (session) session.timers.push(timer);
      }

      async function enableSfx() {
        const audio = getAudioContext();
        if (!audio) {
          gameStatus.textContent = "此瀏覽器不支援角色音效";
          return;
        }
        try {
          await audio.resume();
          sfxEnabled = true;
          renderSfxState(true);
          const announceSfx = !activeSpecialActionId;
          if (activeSpecialActionId) {
            playSpecialActionSound(activeSpecialActionId);
          } else {
            gameStatus.textContent = "角色特殊音效已開啟";
          }
          if (announceSfx) {
            window.setTimeout(() => {
              if (!activeTeacher && !activeSpecialActionId) gameStatus.textContent = currentRoom === ROOM_TEACHERS
                ? "老師們正在練團室準備中"
                : "三組演出團隊正在參加者休息室準備演出";
            }, 1500);
          }
        } catch (error) {
          sfxEnabled = false;
          renderSfxState(false);
          console.warn("角色音效無法啟用", error);
        }
      }

      function disableSfx() {
        stopSpecialActionSound(null, true);
        sfxEnabled = false;
        renderSfxState(false);
        if (audioContext && audioContext.state === "running") audioContext.suspend().catch(() => {});
      }

      function loadImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`無法載入圖片：${source}`));
          image.src = source;
        });
      }

      function asset(filename) {
        return `${ASSET_ROOT}/${filename}?v=${ASSET_VERSION}`;
      }

      async function loadAssets() {
        [background, participantBackground] = await Promise.all([
          loadImage(asset("rehearsal-room.png")),
          loadImage(asset("participant-lounge-room-v2.png"))
        ]);
        const [tabbyCat, blackCat, wantingHandpan, wantingTurtle, wantingTree] = await Promise.all([
          loadImage(asset("mina-tabby-cat.png")),
          loadImage(asset("mina-black-cat.png")),
          loadImage(asset("wanting-handpan-v2.png")),
          loadImage(asset("wanting-turtle-v2.png")),
          loadImage(asset("wanting-spirit-tree-v1.png"))
        ]);
        images.set("mina-cat:tabby", tabbyCat);
        images.set("mina-cat:black", blackCat);
        images.set("wanting:handpan", wantingHandpan);
        images.set("wanting:turtle", wantingTurtle);
        images.set("wanting:tree", wantingTree);
        await Promise.all(Object.entries(signatureActionSpecs).map(async ([id, spec]) => {
          await Promise.all(spec.assets.map(async (filename, frame) => {
            images.set(`signature:${id}:${frame}`, await loadImage(asset(filename)));
          }));
        }));
        await Promise.all(teacherSpecs.flatMap(spec => directions.flatMap(direction => [0, 1, 2].map(async frame => {
          const image = await loadImage(asset(`${spec.id}-v5-${direction}-${frame}.png`));
          images.set(`${spec.id}-v5:${direction}:${frame}`, image);
        }))));
        await Promise.all(participantSpecs.flatMap(spec => directions.flatMap(direction => [0, 1, 2].map(async frame => {
          const image = await loadImage(asset(`${spec.id}-v5-${direction}-${frame}.png`));
          images.set(`${spec.id}-v5:${direction}:${frame}`, image);
        }))));
        await Promise.all(participantSpecs.map(async spec => {
          const image = await loadImage(asset(`${spec.id}-dialogue-portrait-v1.png`));
          images.set(`participant-portrait:${spec.id}`, image);
        }));
      }

      function isWalkable(x, y) {
        if (x < 185 || x > 1490 || y < 325 || y > 850) return false;
        if (x < 565 && y < 445) return false;
        if (x < 275 && y < 640) return false;
        if (x > 1260 && y < 430) return false;
        if (x > 1170 && y > 650) return false;
        if (y > 810 && (x < 650 || x > 1025)) return false;
        return true;
      }

      const ACTION_ZONE_X = 220;
      const ACTION_ZONE_Y = 120;

      function collisionRadius(teacher) {
        return {
          x: 26 + teacher.height * .07,
          y: 12 + teacher.height * .035
        };
      }

      function ellipseOverlap(ax, ay, bx, by, radiusX, radiusY) {
        const dx = (ax - bx) / radiusX;
        const dy = (ay - by) / radiusY;
        return dx * dx + dy * dy < 1;
      }

      function isTeacherActionActive(teacher, now = performance.now()) {
        return (teacher.id === "mina" && isMinaActionActive(now)) ||
          (teacher.id === "wanting" && isWantingActionActive(now)) ||
          isSignatureActionActive(teacher.id, now);
      }

      function isPointClearOfTeachers(x, y, ignoredTeacher = null, scale = 1) {
        return teachers.every(other => {
          if (other === ignoredTeacher) return true;
          const otherRadius = collisionRadius(other);
          const ignoredRadius = ignoredTeacher ? collisionRadius(ignoredTeacher) : { x: 36, y: 18 };
          return !ellipseOverlap(
            x, y, other.x, other.y,
            (ignoredRadius.x + otherRadius.x) * scale,
            (ignoredRadius.y + otherRadius.y) * scale
          );
        });
      }

      function isPointClearOfActionZones(x, y, ignoredTeacher = null, now = performance.now()) {
        return teachers.every(other => {
          if (other === ignoredTeacher || !isTeacherActionActive(other, now)) return true;
          return !ellipseOverlap(x, y, other.x, other.y, ACTION_ZONE_X, ACTION_ZONE_Y);
        });
      }

      function randomTargetFor(teacher = null, now = performance.now()) {
        for (let attempt = 0; attempt < 80; attempt += 1) {
          const x = 215 + Math.random() * 1240;
          const y = 360 + Math.random() * 455;
          if (!isWalkable(x, y)) continue;
          if (!isPointClearOfTeachers(x, y, teacher, 1.15)) continue;
          if (!isPointClearOfActionZones(x, y, teacher, now)) continue;
          return { x, y };
        }
        return teacher ? { x: teacher.x, y: teacher.y } : { x: 820, y: 620 };
      }

      function randomTarget() {
        return randomTargetFor();
      }

      function createTeacher(spec, index) {
        return {
          ...spec,
          direction: index % 2 ? "left" : "right",
          target: randomTarget(),
          speed: reducedMotion ? 0 : 34 + Math.random() * 20,
          moving: !reducedMotion,
          idleUntil: 0,
          pauseUntil: 0,
          step: Math.random() * Math.PI * 2,
          walkDistance: Math.random() * 28,
          avoidSide: index % 2 ? -1 : 1,
          avoidUntil: 0,
          bubble: "",
          bubbleSource: null,
          bubbleUntil: 0,
          drawBox: null
        };
      }

      function isParticipantWalkable(x, y) {
        return x >= 430 && x <= 1250 && y >= 440 && y <= 775;
      }

      function isPointClearOfParticipants(x, y, ignoredParticipant = null) {
        return participants.every(other => {
          if (other === ignoredParticipant) return true;
          const otherRadius = collisionRadius(other);
          const ignoredRadius = ignoredParticipant ? collisionRadius(ignoredParticipant) : { x: 36, y: 18 };
          return !ellipseOverlap(
            x, y, other.x, other.y,
            ignoredRadius.x + otherRadius.x,
            ignoredRadius.y + otherRadius.y
          );
        });
      }

      function randomParticipantTarget(participant = null) {
        for (let attempt = 0; attempt < 50; attempt += 1) {
          const x = 430 + Math.random() * 820;
          const y = 440 + Math.random() * 335;
          if (!isParticipantWalkable(x, y)) continue;
          if (!isPointClearOfParticipants(x, y, participant)) continue;
          return { x, y };
        }
        return participant ? { x: participant.x, y: participant.y } : { x: 835, y: 650 };
      }

      function createParticipant(spec, index) {
        return {
          ...spec,
          direction: index % 2 ? "left" : "right",
          target: randomParticipantTarget(),
          speed: reducedMotion ? 0 : 32 + Math.random() * 15,
          moving: !reducedMotion,
          idleUntil: 0,
          pauseUntil: 0,
          walkDistance: Math.random() * 28,
          bubble: "",
          bubbleSource: null,
          bubbleUntil: 0,
          drawBox: null
        };
      }

      function updateParticipant(participant, delta, now) {
        if (
          reducedMotion ||
          participant === activeTeacher ||
          now < participant.pauseUntil ||
          now < participant.idleUntil
        ) {
          participant.moving = false;
          return;
        }

        const dx = participant.target.x - participant.x;
        const dy = participant.target.y - participant.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 8) {
          participant.moving = false;
          participant.idleUntil = now + 800 + Math.random() * 1700;
          participant.target = randomParticipantTarget(participant);
          if (Math.random() < .55) {
            participant.direction = ["down", "left", "right"][Math.floor(Math.random() * 3)];
          }
          return;
        }

        participant.direction = chooseDirection(dx, dy);
        participant.moving = true;
        const amount = Math.min(distance, participant.speed * delta / 1000);
        const nextX = participant.x + dx / distance * amount;
        const nextY = participant.y + dy / distance * amount;
        if (
          isParticipantWalkable(nextX, nextY) &&
          isPointClearOfParticipants(nextX, nextY, participant)
        ) {
          participant.x = nextX;
          participant.y = nextY;
          participant.walkDistance += amount;
          return;
        }

        participant.moving = false;
        participant.target = randomParticipantTarget(participant);
        participant.idleUntil = now + 180 + Math.random() * 220;
      }

      function isMinaActionActive(now = performance.now()) {
        return Boolean(minaCatAction && now < minaCatAction.until);
      }

      function startMinaCatAction(now = performance.now()) {
        const mina = teachers.find(teacher => teacher.id === "mina");
        if (!mina) return false;

        const duration = 10800;
        minaCatAction = {
          startedAt: now,
          until: now + duration,
          lines: shuffled(minaActionLines)
        };
        mina.pauseUntil = Math.max(mina.pauseUntil, now + duration + 350);
        mina.moving = false;
        mina.direction = "down";
        mina.bubble = "";
        mina.bubbleSource = null;
        mina.target = { x: mina.x, y: mina.y };
        if (!activeTeacher) gameStatus.textContent = "Mina 正和五隻虎斑貓、一隻黑貓玩耍中";
        return true;
      }

      function isWantingActionActive(now = performance.now()) {
        return Boolean(wantingMeditationAction && now < wantingMeditationAction.until);
      }

      function startWantingMeditationAction(now = performance.now()) {
        const wanting = teachers.find(teacher => teacher.id === "wanting");
        if (!wanting) return false;

        const duration = 9800;
        wantingMeditationAction = {
          startedAt: now,
          until: now + duration,
          lines: shuffled(wantingActionLines)
        };
        wanting.pauseUntil = Math.max(wanting.pauseUntil, now + duration + 350);
        wanting.moving = false;
        wanting.direction = "down";
        wanting.bubble = "";
        wanting.bubbleSource = null;
        wanting.target = { x: wanting.x, y: wanting.y };
        if (!activeTeacher) gameStatus.textContent = "宛庭老師正用手碟享受心靈平靜";
        return true;
      }

      function isSignatureActionActive(id, now = performance.now()) {
        const action = signatureActions.get(id);
        return Boolean(action && now < action.until);
      }

      function startSignatureAction(id, now = performance.now()) {
        const spec = signatureActionSpecs[id];
        const teacher = teachers.find(candidate => candidate.id === id);
        if (!spec || !teacher) return false;

        signatureActions.set(id, {
          startedAt: now,
          until: now + spec.duration,
          lines: shuffled(spec.lines)
        });
        teacher.pauseUntil = Math.max(teacher.pauseUntil, now + spec.duration + 350);
        teacher.moving = false;
        teacher.direction = "down";
        teacher.bubble = "";
        teacher.bubbleSource = null;
        teacher.target = { x: teacher.x, y: teacher.y };
        if (!activeTeacher) gameStatus.textContent = spec.status;
        return true;
      }

      function shuffled(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
        }
        return result;
      }

      function nextRandomSpecialActionId() {
        if (!specialActionOrder.length) {
          specialActionOrder = shuffled(SPECIAL_ACTION_IDS);
          if (specialActionOrder[0] === lastSpecialActionId && specialActionOrder.length > 1) {
            [specialActionOrder[0], specialActionOrder[1]] = [specialActionOrder[1], specialActionOrder[0]];
          }
        }
        return specialActionOrder.shift();
      }

      function specialActionUntil(id) {
        if (id === "mina") return minaCatAction?.until || 0;
        if (id === "wanting") return wantingMeditationAction?.until || 0;
        return signatureActions.get(id)?.until || 0;
      }

      function reactionLineFor(reactor, trigger) {
        const override = teacherReactionOverrides[trigger.id]?.[reactor.id];
        if (override) return override;
        const lines = teacherReactionLines[reactor.id] || ["{name} 加油！"];
        const line = lines[Math.floor(Math.random() * lines.length)];
        return line.replace("{name}", trigger.name);
      }

      function actionDialogueAt(action, fallbackLines, duration, now) {
        const lines = action?.lines?.length ? action.lines : fallbackLines;
        const elapsed = Math.max(0, now - action.startedAt);
        const slotDuration = Math.max(1, duration / lines.length);
        const index = Math.min(lines.length - 1, Math.floor(elapsed / slotDuration));
        return { text: lines[index], lines, index };
      }

      function scheduleSpecialReactions(triggerId, now) {
        const trigger = teachers.find(teacher => teacher.id === triggerId);
        if (!trigger) {
          specialReactionQueue = [];
          return;
        }
        teachers.forEach(teacher => {
          teacher.bubble = "";
          teacher.bubbleSource = null;
          teacher.bubbleUntil = now;
        });
        const reactors = shuffled(teachers.filter(teacher => teacher.id !== triggerId));
        const reactionStart = now + 850;
        const reactionEnd = Math.max(reactionStart + 1800, specialActionUntil(triggerId) - 450);
        const reactionSlot = (reactionEnd - reactionStart) / Math.max(1, reactors.length);
        specialReactionQueue = reactors.map((reactor, index) => ({
          reactorId: reactor.id,
          text: reactionLineFor(reactor, trigger),
          at: reactionStart + index * reactionSlot,
          until: Math.min(
            reactionEnd,
            reactionStart + (index + 1) * reactionSlot - 140
          )
        }));
      }

      function updateSpecialReactions(now) {
        if (!activeSpecialActionId || !specialReactionQueue.length) return;
        while (specialReactionQueue.length && now >= specialReactionQueue[0].at) {
          const reaction = specialReactionQueue.shift();
          teachers.forEach(teacher => {
            if (teacher.id !== activeSpecialActionId) {
              teacher.bubbleUntil = now;
              if (teacher.bubbleSource === "special") teacher.bubbleSource = null;
            }
          });
          const reactor = teachers.find(teacher => teacher.id === reaction.reactorId);
          if (!reactor) continue;
          reactor.bubble = reaction.text;
          reactor.bubbleSource = "special";
          reactor.bubbleUntil = reaction.until;
          reactor.pauseUntil = Math.max(reactor.pauseUntil, reaction.until);
          gameShell.dataset.reactionSpeaker = reactor.id;
          gameShell.dataset.reactionText = reaction.text;
        }
      }

      function clearSpecialAction(id, now = performance.now(), scheduleNext = true) {
        if (!id) return;
        stopSpecialActionSound(id);
        if (id === "mina") minaCatAction = null;
        else if (id === "wanting") wantingMeditationAction = null;
        else signatureActions.delete(id);
        const teacher = teachers.find(candidate => candidate.id === id);
        if (teacher) teacher.target = randomTargetFor(teacher, now);
        if (activeSpecialActionId === id) activeSpecialActionId = null;
        specialReactionQueue = [];
        teachers.forEach(candidate => {
          candidate.bubbleUntil = Math.min(candidate.bubbleUntil, now);
          candidate.bubbleSource = null;
        });
        delete gameShell.dataset.activeSpecial;
        delete gameShell.dataset.reactionSpeaker;
        delete gameShell.dataset.reactionText;
        gameShell.dataset.specialEndedAt = String(Math.round(now));
        if (scheduleNext) {
          nextSpecialActionAt = now + 5000 + Math.random() * 4000;
          gameShell.dataset.nextSpecialAt = String(Math.round(nextSpecialActionAt));
        }
        ambientDialogueLockedUntil = Math.max(ambientDialogueLockedUntil, now + 1800);
        nextAmbientAt = Math.max(nextAmbientAt, ambientDialogueLockedUntil + 900);
        if (!activeTeacher && currentRoom === ROOM_TEACHERS) {
          gameStatus.textContent = "老師們正在練團室準備中";
        }
      }

      function startSpecialAction(id, now = performance.now()) {
        if (activeSpecialActionId || activeTeacher || currentRoom !== ROOM_TEACHERS) return false;
        let started = false;
        if (id === "mina") started = startMinaCatAction(now);
        else if (id === "wanting") started = startWantingMeditationAction(now);
        else started = startSignatureAction(id, now);
        if (!started) return false;

        activeSpecialActionId = id;
        lastSpecialActionId = id;
        gameShell.dataset.activeSpecial = id;
        gameShell.dataset.specialStartedAt = String(Math.round(now));
        ambientDialogueLockedUntil = Math.max(ambientDialogueLockedUntil, specialActionUntil(id) + 1800);
        nextAmbientAt = Math.max(nextAmbientAt, ambientDialogueLockedUntil + 900);
        scheduleSpecialReactions(id, now);
        playSpecialActionSound(id);
        return true;
      }

      function updateSpecialActionScheduler(now) {
        if (activeSpecialActionId) {
          if (now >= specialActionUntil(activeSpecialActionId)) {
            clearSpecialAction(activeSpecialActionId, now, true);
          } else {
            updateSpecialReactions(now);
          }
          return;
        }
        if (activeTeacher || currentRoom !== ROOM_TEACHERS || now < nextSpecialActionAt) return;
        const nextId = nextRandomSpecialActionId();
        if (!startSpecialAction(nextId, now)) nextSpecialActionAt = now + 1000;
      }

      function chooseDirection(dx, dy) {
        if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? "left" : "right";
        return dy < 0 ? "up" : "down";
      }

      function canOccupyPosition(teacher, x, y, now) {
        if (!isWalkable(x, y)) return false;
        if (!isPointClearOfActionZones(x, y, teacher, now)) {
          const movingAwayFromActiveActions = teachers.every(other => {
            if (other === teacher || !isTeacherActionActive(other, now)) return true;
            const currentDistance =
              ((teacher.x - other.x) / ACTION_ZONE_X) ** 2 +
              ((teacher.y - other.y) / ACTION_ZONE_Y) ** 2;
            const nextDistance =
              ((x - other.x) / ACTION_ZONE_X) ** 2 +
              ((y - other.y) / ACTION_ZONE_Y) ** 2;
            return nextDistance > currentDistance;
          });
          if (!movingAwayFromActiveActions) return false;
        }
        const radius = collisionRadius(teacher);
        return teachers.every(other => {
          if (other === teacher) return true;
          const otherRadius = collisionRadius(other);
          return !ellipseOverlap(
            x, y, other.x, other.y,
            radius.x + otherRadius.x,
            radius.y + otherRadius.y
          );
        });
      }

      function moveTeacherTo(teacher, x, y, distance) {
        teacher.x = x;
        teacher.y = y;
        teacher.walkDistance += distance;
      }

      function updateTeacher(teacher, delta, now) {
        if (reducedMotion || now < teacher.pauseUntil) {
          teacher.moving = false;
          return;
        }

        if (now < teacher.idleUntil) {
          teacher.moving = false;
          return;
        }

        const dx = teacher.target.x - teacher.x;
        const dy = teacher.target.y - teacher.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 8) {
          teacher.moving = false;
          teacher.idleUntil = now + 700 + Math.random() * 1800;
          teacher.target = randomTargetFor(teacher, now);
          if (Math.random() < .55) teacher.direction = ["down", "left", "right"][Math.floor(Math.random() * 3)];
          return;
        }

        if (now >= teacher.avoidUntil) teacher.direction = chooseDirection(dx, dy);
        teacher.moving = true;
        teacher.step += delta * .012;
        const amount = Math.min(distance, teacher.speed * delta / 1000);
        const forwardX = dx / distance;
        const forwardY = dy / distance;
        const nextX = teacher.x + forwardX * amount;
        const nextY = teacher.y + forwardY * amount;

        if (canOccupyPosition(teacher, nextX, nextY, now)) {
          moveTeacherTo(teacher, nextX, nextY, amount);
          return;
        }

        // 避讓位移不覆寫角色面向，並短暫鎖定同一側，避免每幀切換圖組造成抖動。
        teacher.avoidUntil = Math.max(teacher.avoidUntil, now + 420);
        const sideX = -forwardY * teacher.avoidSide;
        const sideY = forwardX * teacher.avoidSide;
        const detourVectors = [
          { x: forwardX * .28 + sideX * .96, y: forwardY * .28 + sideY * .96 },
          { x: sideX, y: sideY }
        ];

        for (const vector of detourVectors) {
          const vectorLength = Math.hypot(vector.x, vector.y) || 1;
          const detourX = teacher.x + vector.x / vectorLength * amount;
          const detourY = teacher.y + vector.y / vectorLength * amount;
          if (!canOccupyPosition(teacher, detourX, detourY, now)) continue;
          moveTeacherTo(teacher, detourX, detourY, amount);
          return;
        }

        teacher.moving = false;
        teacher.avoidSide *= -1;
        teacher.avoidUntil = now + 480;
        teacher.target = randomTargetFor(teacher, now);
        teacher.idleUntil = now + 180 + Math.random() * 160;
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
      }

      function drawParticipantRoomBackground() {
        context.drawImage(participantBackground, 0, 0, WIDTH, HEIGHT);
      }

      function drawParticipant(participant, now) {
        drawTeacher(participant, now);
      }

      function drawParticipantRoom(now) {
        drawParticipantRoomBackground();
        [...participants].sort((a, b) => a.y - b.y).forEach(participant => {
          drawParticipant(participant, now);
          drawBubble(participant, now);
        });
        context.save();
        const vignette = context.createRadialGradient(WIDTH / 2, HEIGHT / 2, 250, WIDTH / 2, HEIGHT / 2, 960);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(0,0,0,.27)");
        context.fillStyle = vignette;
        context.fillRect(0, 0, WIDTH, HEIGHT);
        context.restore();
      }

      function easeOutCubic(value) {
        const clamped = Math.max(0, Math.min(1, value));
        return 1 - (1 - clamped) ** 3;
      }

      function drawPixelHeart(x, y, size, alpha) {
        context.save();
        context.globalAlpha = alpha;
        context.fillStyle = "#f4a2a0";
        context.fillRect(Math.round(x), Math.round(y), size, size);
        context.fillRect(Math.round(x + size * 2), Math.round(y), size, size);
        context.fillRect(Math.round(x - size), Math.round(y + size), size * 4, size);
        context.fillRect(Math.round(x), Math.round(y + size * 2), size * 2, size);
        context.restore();
      }

      function drawMinaCatHearts(mina, elapsed, remaining) {
        const period = 2.15;
        const actionAlpha = Math.min(1, elapsed / .65, remaining / .7);

        minaHeartSpecs.forEach((heart, index) => {
          const cycle = (elapsed - heart.delay + period * 4) % period;
          if (cycle > 1.22) return;
          const progress = cycle / 1.22;
          const alpha = Math.sin(progress * Math.PI) * actionAlpha;
          const drift = Math.sin(elapsed * 3.1 + index) * 2.5;
          drawPixelHeart(
            mina.x + heart.dx + drift,
            mina.y + heart.dy - progress * 17,
            heart.size,
            alpha * .92
          );
        });
      }

      function drawMinaCats(mina, now) {
        if (!isMinaActionActive(now)) return;

        const elapsed = (now - minaCatAction.startedAt) / 1000;
        const remaining = (minaCatAction.until - now) / 1000;

        minaCatSpecs.forEach((cat, index) => {
          const entryDelay = index * .17;
          const entered = easeOutCubic((elapsed - entryDelay) / 1.05);
          const leaving = Math.max(0, Math.min(1, remaining / .85));
          const visibility = Math.min(entered, leaving);
          if (visibility <= 0) return;

          const image = images.get(`mina-cat:${cat.type}`);
          const targetX = mina.x + cat.dx;
          const startX = mina.x + cat.entry * (250 + index * 18);
          const x = startX + (targetX - startX) * entered;
          const hop = Math.max(0, Math.sin(elapsed * 3.6 + cat.phase)) * (index % 2 ? 5 : 8);
          const playSway = Math.sin(elapsed * 2.5 + cat.phase) * 3;
          const feetY = mina.y + cat.dy - hop;
          const height = cat.height * (.82 + visibility * .18);
          const width = height * image.width / image.height;
          const paddingBottom = height * 8 / image.height;

          context.save();
          context.globalAlpha = visibility * .24;
          context.fillStyle = "#000";
          context.beginPath();
          context.ellipse(x + playSway, feetY - paddingBottom + 1, width * .30, 4.5, 0, 0, Math.PI * 2);
          context.fill();
          context.restore();

          context.save();
          context.globalAlpha = visibility;
          context.translate(Math.round(x + playSway), Math.round(feetY - height / 2));
          context.rotate(Math.sin(elapsed * 2.1 + cat.phase) * .025);
          if (cat.flip) context.scale(-1, 1);
          context.drawImage(image, -width / 2, -height / 2, width, height);
          context.restore();
        });

        drawMinaCatHearts(mina, elapsed, remaining);

      function drawWantingMeditation(wanting, now) {

        context.fill();
        context.restore();

        context.save();
        context.globalAlpha = appear;
        context.drawImage(image, 0, 0, image.width, cropHeight, bodyX, bodyY, bodyWidth, bodyHeight * .72);

        // 盤坐的雙腿，讓原本的站姿轉為安定的冥想姿勢。
        context.fillStyle = "#536b86";
        context.fillRect(Math.round(wanting.x - 51), Math.round(wanting.y - 40), 42, 16);
        context.fillRect(Math.round(wanting.x + 9), Math.round(wanting.y - 40), 42, 16);

        // 精緻手碟素材與敲擊時的柔和起伏。

          handpanImage,

          Math.round(handpanY - handpanHeight * .48),
          handpanWidth,
          handpanHeight
        );

        const tap = Math.max(0, Math.sin(elapsed * 5.1));
        context.fillStyle = "#efc8a8";
        context.fillRect(Math.round(wanting.x - 34), Math.round(handpanY - 15 - tap * 6), 12, 8);
        context.fillRect(Math.round(wanting.x + 22), Math.round(handpanY - 15 - (1 - tap) * 6), 12, 8);
        context.restore();

        // 精緻小海龜會在旁邊緩緩探頭、隨音樂擺動。
        const turtleX = wanting.x + 76 + Math.sin(elapsed * 1.25) * 5;
        const turtleY = wanting.y - 12 - Math.max(0, Math.sin(elapsed * 2.1)) * 3;
        const turtleImage = images.get("wanting:turtle");

        context.save();
        context.globalAlpha = appear;
        context.translate(Math.round(turtleX), Math.round(turtleY));
        context.rotate(Math.sin(elapsed * 2.25) * .055);
        context.scale(1 + Math.sin(elapsed * 4.2) * .018, 1 - Math.sin(elapsed * 4.2) * .018);
        context.drawImage(turtleImage, -turtleWidth / 2, -turtleHeight / 2, turtleWidth, turtleHeight);

        const heartCycle = (elapsed + .25) % 1.85;

        // 只在桌面附近補上局部手部動作，不替換人物本體。

        context.fillRect(Math.round(teacher.x + 18), Math.round(teacher.y - 67 - (1 - handBeat) * 3), 10, 7);

        const particleColor = craftPhase === 0 ? "#f7d56b" : craftPhase === 1 ? "#8feaff" : "#d9c8aa";
        context.fillStyle = particleColor;
        for (let index = 0; index < 5; index += 1) {
          const drift = (elapsed * 1.7 + index * .19) % 1;

        context.fillRect(Math.round(teacher.x + 24), Math.round(teacher.y - 106), 14, 4);

        teacher.drawBox = {

        };

      function drawLayeredSignatureAction(teacher, now) {

          extraBox = { x: dogX, y: dogY, width: dogWidth, height: dogHeight };

        teacher.drawBox = {
          x: Math.min(baseBox.x, extraBox.x),
          y: Math.min(baseBox.y, extraBox.y),

          height: Math.max(baseBox.y + baseBox.height, extraBox.y + extraBox.height) - Math.min(baseBox.y, extraBox.y)
        };

      function drawTeacher(teacher, now) {
        const walkSequence = [0, 1, 2, 1];
        const walkFrame = teacher.moving
          ? walkSequence[Math.floor(teacher.walkDistance / 9) % walkSequence.length]
          : 1;
        const image = images.get(`${teacher.id}-v5:${teacher.direction}:${walkFrame}`);
        const bob = teacher.id === "mina" && isMinaActionActive(now)
          ? Math.sin((now - minaCatAction.startedAt) * .006) * 2.2
          : 0;
        const height = teacher.height;
        const width = height * image.width / image.height;
        const x = teacher.x - width / 2;
        const y = teacher.y - height + bob;
        const feetY = teacher.y + bob - height * 12 / image.height;

        if (teacher === hoveredTeacher || teacher === activeTeacher) {
          context.save();
          context.globalAlpha = .72;
          context.fillStyle = teacher === activeTeacher ? "#f0d49a" : "#d8ad5b";
          context.beginPath();
          context.ellipse(teacher.x, feetY + 2, width * .28, 8, 0, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        context.save();
        context.globalAlpha = .27;
        context.fillStyle = "#000";
        context.beginPath();
        context.ellipse(teacher.x + 2, feetY + 2, width * .3, 7, 0, 0, Math.PI * 2);
        context.fill();
        context.restore();

        context.drawImage(image, Math.round(x), Math.round(y), Math.round(width), Math.round(height));
        teacher.drawBox = { x, y, width, height };

        if (teacher === hoveredTeacher && teacher !== activeTeacher &&
            !(teacher.id === "mina" && isMinaActionActive(now)) &&
            !(teacher.id === "wanting" && isWantingActionActive(now)) &&
            !isSignatureActionActive(teacher.id, now)) {
          context.save();
          context.font = '700 30px "Noto Sans TC", system-ui, sans-serif';
          const label = teacher.name;
          const labelWidth = context.measureText(label).width + 48;
          const labelHeight = 52;
          const labelY = y - 67;
          roundedRect(teacher.x - labelWidth / 2, labelY, labelWidth, labelHeight, 10);
          context.fillStyle = "rgba(22, 5, 6, .9)";
          context.fill();
          context.strokeStyle = "#d8ad5b";
          context.lineWidth = 3;
          context.stroke();
          context.fillStyle = "#f6e8c8";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillText(label, teacher.x, labelY + labelHeight / 2 + 1);
          context.restore();
        }
      }

      function draw(now) {
        context.imageSmoothingEnabled = false;
        if (currentRoom === ROOM_PARTICIPANTS) {
          drawParticipantRoom(now);
          return;
        }
        context.drawImage(background, 0, 0, WIDTH, HEIGHT);

        const ordered = [...teachers].sort((a, b) => a.y - b.y);
        ordered.forEach(teacher => {
          if (teacher.id === "wanting" && isWantingActionActive(now)) drawWantingMeditation(teacher, now);
          else if (teacher.id === "tc" && isSignatureActionActive("tc", now)) drawTCModelAction(teacher, now);
          else if (isSignatureActionActive(teacher.id, now)) drawLayeredSignatureAction(teacher, now);
          else drawTeacher(teacher, now);
          if (teacher.id === "mina") drawMinaCats(teacher, now);
        });
        ordered.forEach(teacher => drawBubble(teacher, now));
        const mina = teachers.find(teacher => teacher.id === "mina");
        if (mina) drawMinaActionBubble(mina, now);
        const wanting = teachers.find(teacher => teacher.id === "wanting");
        if (wanting) drawWantingActionBubble(wanting, now);
        ordered.forEach(teacher => drawSignatureActionBubble(teacher, now));

        context.save();
        const vignette = context.createRadialGradient(WIDTH / 2, HEIGHT / 2, 270, WIDTH / 2, HEIGHT / 2, 920);
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(0,0,0,.22)");
        context.fillStyle = vignette;
        context.fillRect(0, 0, WIDTH, HEIGHT);
        context.restore();
      }

      function animate(now) {
        if (!running) return;
        const delta = Math.min(42, now - lastFrame);
        lastFrame = now;
        if (currentRoom === ROOM_TEACHERS) {
          updateSpecialActionScheduler(now);
          teachers.forEach(teacher => updateTeacher(teacher, delta, now));

          if (!reducedMotion &&
              !activeSpecialActionId &&
              now >= ambientDialogueLockedUntil &&
              now >= nextAmbientAt) {
            const candidates = teachers.filter(teacher =>
              teacher !== activeTeacher &&
              !(teacher.id === "mina" && isMinaActionActive(now)) &&
              !(teacher.id === "wanting" && isWantingActionActive(now)) &&
              !isSignatureActionActive(teacher.id, now)
            );
            const teacher = candidates[Math.floor(Math.random() * candidates.length)];
            if (teacher) {
              teacher.bubble = teacher.bubbles[Math.floor(Math.random() * teacher.bubbles.length)];
              teacher.bubbleSource = "ambient";
              teacher.bubbleUntil = now + 1900 + Math.random() * 900;
              teacher.pauseUntil = now + 650;
            }
            nextAmbientAt = now + 3200 + Math.random() * 4300;
          }
        } else {
          participants.forEach(participant => updateParticipant(participant, delta, now));
          if (!reducedMotion && now >= nextAmbientAt) {
            const candidates = participants.filter(participant => participant !== activeTeacher);
            const participant = candidates[Math.floor(Math.random() * candidates.length)];
            if (participant) {
              participant.bubble = participant.bubbles[Math.floor(Math.random() * participant.bubbles.length)];
              participant.bubbleSource = "ambient";
              participant.bubbleUntil = now + 1900 + Math.random() * 900;
              participant.pauseUntil = now + 650;
            }
            nextAmbientAt = now + 3200 + Math.random() * 4300;
          }
        }

        draw(now);
        requestAnimationFrame(animate);
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * WIDTH / rect.width,
          y: (event.clientY - rect.top) * HEIGHT / rect.height
        };
      }

      function teacherAt(point) {
        const roomCharacters = currentRoom === ROOM_TEACHERS ? teachers : participants;
        return [...roomCharacters]
          .sort((a, b) => b.y - a.y)
          .find(teacher => {
            const box = teacher.drawBox;
            return box && point.x >= box.x && point.x <= box.x + box.width && point.y >= box.y && point.y <= box.y + box.height;
          }) || null;
      }

      function typeDialogue(text) {
        const token = ++typingToken;
        dialogueText.textContent = "";
        let index = 0;
        const step = () => {
          if (token !== typingToken) return;
          dialogueText.textContent = text.slice(0, index);
          index += 1;
          if (index <= text.length) window.setTimeout(step, reducedMotion ? 0 : 25);
        };
        step();
      }

      function openDialogue(teacher, lineIndex = null) {
        if (!teacher) return;
        const dialogueOpenedAt = performance.now();
        if (activeSpecialActionId) {
          clearSpecialAction(activeSpecialActionId, dialogueOpenedAt, true);
        }
        if (teacher.kind !== "participant") {
          if (teacher.id === "mina") {
            minaCatAction = null;
            if (sfxEnabled && performance.now() - lastCatSoundAt > 650) playCatMeow(55, .15);
          }
          if (teacher.id === "wanting") wantingMeditationAction = null;
          if (signatureActions.has(teacher.id)) signatureActions.delete(teacher.id);
        }
        activeTeacher = teacher;
        activeLine = lineIndex === null ? (activeLine + 1) % teacher.lines.length : lineIndex;
        teacher.pauseUntil = dialogueOpenedAt + 14000;
        teacher.moving = false;
        teacher.direction = "down";
        teacher.bubble = "！";
        teacher.bubbleSource = "interaction";
        teacher.bubbleUntil = performance.now() + 900;
        const usesSleepDeprivedUi = teacher.band === "sleep-deprived";
        dialogue.classList.toggle("is-sleep-deprived", usesSleepDeprivedUi);
        dialogue.setAttribute(
          "aria-label",
          usesSleepDeprivedUi ? "睡眠不足樂團角色對話" : "角色對話"
        );
        dialoguePortrait.classList.toggle("is-full-frame", teacher.kind === "participant");
        dialoguePortrait.src = asset(`${teacher.id}-dialogue-portrait-v1.png`);
        dialoguePortrait.alt = `${teacher.name}對話肖像`;
        dialogueName.textContent = teacher.name;
        dialogueRole.textContent = teacher.role;
        dialogue.hidden = false;
        typeDialogue(teacher.lines[activeLine]);
        gameStatus.textContent = `正在和 ${teacher.name} 對話`;
      }

      function closeDialogue() {
        typingToken += 1;
        if (activeTeacher) {
          activeTeacher.pauseUntil = performance.now() + 800;
          activeTeacher.target = activeTeacher.kind === "participant"
            ? randomParticipantTarget(activeTeacher)
            : randomTargetFor(activeTeacher, performance.now());
        }
        activeTeacher = null;
        dialogue.hidden = true;
        gameStatus.textContent = currentRoom === ROOM_TEACHERS
          ? "老師們正在練團室準備中"
          : "三組演出團隊正在參加者休息室準備演出";
      }

      function buildTeacherNav() {
        const roomCharacters = currentRoom === ROOM_TEACHERS ? teachers : participants;
        teacherNav.replaceChildren();
        teacherNav.hidden = roomCharacters.length === 0;
        teacherNav.setAttribute("aria-label", currentRoom === ROOM_TEACHERS ? "選擇老師互動" : "選擇參加者互動");
        roomCharacters.forEach(teacher => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = teacher.name;
          button.setAttribute("aria-label", `和${teacher.name}對話`);
          button.addEventListener("click", () => openDialogue(teacher, 0));
          teacherNav.append(button);
        });
      }

      function switchRoom(room) {
        if (room !== ROOM_TEACHERS && room !== ROOM_PARTICIPANTS) return;
        if (!dialogue.hidden) closeDialogue();
        const roomChangedAt = performance.now();
        if (activeSpecialActionId) clearSpecialAction(activeSpecialActionId, roomChangedAt, true);
        currentRoom = room;
        hoveredTeacher = null;
        activeLine = 0;
        nextAmbientAt = performance.now() + 1800;
        const inTeacherRoom = room === ROOM_TEACHERS;
        if (inTeacherRoom) nextSpecialActionAt = Math.max(nextSpecialActionAt, roomChangedAt + 1500);
        teacherRoomButton.setAttribute("aria-pressed", String(inTeacherRoom));
        participantRoomButton.setAttribute("aria-pressed", String(!inTeacherRoom));
        roomTitle.textContent = inTeacherRoom ? "十週年練團室" : "參加者休息室";
        gameStatus.textContent = inTeacherRoom
          ? "老師們正在練團室準備中"
          : "三組演出團隊正在參加者休息室準備演出";
        gameShell.setAttribute(
          "aria-label",
          inTeacherRoom ? "鹽與光十週年 RPG 練團室互動場景" : "鹽與光十週年 RPG 參加者休息室互動場景"
        );
        canvas.setAttribute(
          "aria-label",
          inTeacherRoom
            ? "七位老師在練團室中走動；點擊角色可以互動"
            : "十六位演出人員正在參加者休息室走動；點擊角色可以互動"
        );
        roomInstructions.innerHTML = inTeacherRoom
          ? "<strong>操作：</strong>點擊老師開始對話；部分老師的特殊動作會隨機逐一觸發，其他老師將依自己的個性輪流回應。"
          : "<strong>操作：</strong>點擊演出人員開始對話；目前尚未加入特殊表情與動作。";
        buildTeacherNav();
      }

      canvas.addEventListener("pointermove", event => {
        hoveredTeacher = teacherAt(canvasPoint(event));
        canvas.style.cursor = hoveredTeacher ? "pointer" : "default";
      });

      canvas.addEventListener("pointerleave", () => { hoveredTeacher = null; });

      canvas.addEventListener("click", event => {
        const teacher = teacherAt(canvasPoint(event));
        if (teacher) openDialogue(teacher, 0);
        else if (!dialogue.hidden) closeDialogue();
      });

      dialogueNext.addEventListener("click", () => {
        if (!activeTeacher) return;
        activeLine = (activeLine + 1) % activeTeacher.lines.length;
        typeDialogue(activeTeacher.lines[activeLine]);
      });

      dialogueClose.addEventListener("click", closeDialogue);

      teacherRoomButton.addEventListener("click", () => switchRoom(ROOM_TEACHERS));
      participantRoomButton.addEventListener("click", () => switchRoom(ROOM_PARTICIPANTS));

      musicToggle.addEventListener("click", () => {
        if (musicWanted) stopMusic();
        else startMusic();
      });

      sfxToggle.addEventListener("click", () => {
        if (sfxEnabled) disableSfx();
        else enableSfx();
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape") closeDialogue();
        if ((event.key === "Enter" || event.key === " ") && activeTeacher) {
          event.preventDefault();
          dialogueNext.click();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          running = false;
          stopSpecialActionSound(null, true);
          resumeMusicWhenVisible = musicWanted && !bgMusic.paused;
          ++musicFadeToken;
          bgMusic.pause();
          if (audioContext && audioContext.state === "running") audioContext.suspend().catch(() => {});
        } else if (!running) {
          running = true;
          lastFrame = performance.now();
          requestAnimationFrame(animate);
          if (sfxEnabled && audioContext && audioContext.state === "suspended") {
            audioContext.resume()
              .then(() => {
                if (
                  activeSpecialActionId &&
                  performance.now() < specialActionUntil(activeSpecialActionId) - 350
                ) {
                  playSpecialActionSound(activeSpecialActionId);
                }
              })
              .catch(() => {});
          }
          if (resumeMusicWhenVisible && musicWanted) {
            bgMusic.volume = 0;
            bgMusic.play()
              .then(() => fadeMusic(MUSIC_VOLUME))
              .catch(() => {
                musicWanted = false;
                renderMusicState(false);
              });
          }
          resumeMusicWhenVisible = false;
        }
      });

      loadAssets()
        .then(() => {
          teacherSpecs.forEach((spec, index) => teachers.push(createTeacher(spec, index)));
          participantSpecs.forEach((spec, index) => participants.push(createParticipant(spec, index)));
          buildTeacherNav();
          loading.classList.add("is-ready");
          window.setTimeout(() => loading.remove(), 450);
          requestAnimationFrame(animate);
        })
        .catch(error => {
          loading.textContent = `載入失敗：${error.message}`;
          loading.style.color = "#ffb5b5";
          gameStatus.textContent = "場景素材載入失敗";
        });
    })();
  </script>
</body>
</html>
